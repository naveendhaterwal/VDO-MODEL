name: Build and Push to Docker Hub

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install PyTorch (CPU build for CI)
        run: |
          pip install --upgrade pip
          # Pin to same major version as Dockerfile to avoid compat issues
          pip install torch==2.6.0 torchvision==0.21.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: |
          pip install pytest pytest-timeout fakeredis httpx
          # bitsandbytes has no CPU wheel on PyPI so skip it in CI (it's Linux/GPU only)
          pip install -r requirements.txt || true
          pip install pytest pytest-timeout fakeredis httpx Pillow

      - name: Run smoke tests
        run: python -m pytest tests/test_pipeline.py tests/smoke_test.py -v --timeout=120

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: naveendhaterwal/vimax
          tags: |
            type=sha,prefix=
            type=raw,value=latest
            type=raw,value=v${{ github.run_number }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.worker
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=registry,ref=naveendhaterwal/vimax:buildcache
          cache-to: type=registry,ref=naveendhaterwal/vimax:buildcache,mode=max
          labels: ${{ steps.meta.outputs.labels }}
