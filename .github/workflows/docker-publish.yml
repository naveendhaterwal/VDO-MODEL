name: Build and Push to Docker Hub

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install torch CPU build for CI (no GPU available in runners)
          pip install torch==2.6.0 torchvision==0.21.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          # Install remaining deps (excludes torch since already installed)
          pip install pytest pytest-timeout fakeredis httpx
          pip install diffusers>=0.38.0,<0.39.0 \
            transformers>=4.44.0,<4.50.0 \
            accelerate>=0.33.0,<0.35.0 \
            "safetensors>=0.4.0" \
            "numpy<2.0.0" \
            "moviepy>=1.0.3,<3.0.0" \
            "fastapi>=0.110.0,<0.116.0" \
            "uvicorn>=0.29.0,<0.31.0" \
            "redis>=5.0.0,<6.0.0" \
            "rq>=1.16.0,<2.0.0" \
            "python-dotenv>=1.0.0,<2.0.0" \
            "huggingface_hub>=0.24.0,<2.0.0" \
            "prometheus-client>=0.20.0,<0.22.0" \
            "protobuf>=5.27.0,<5.29.0" \
            "sentencepiece>=0.2.0,<0.3.0" \
            pydantic httpx

      - name: Run smoke tests
        run: python -m pytest tests/test_pipeline.py tests/smoke_test.py -v --timeout=120

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: naveendhaterwal/vimax
          tags: |
            type=sha,prefix=
            type=raw,value=latest
            type=raw,value=v${{ github.run_number }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.worker
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=registry,ref=naveendhaterwal/vimax:buildcache
          cache-to: type=registry,ref=naveendhaterwal/vimax:buildcache,mode=max
          labels: ${{ steps.meta.outputs.labels }}
