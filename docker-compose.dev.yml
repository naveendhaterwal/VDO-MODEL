version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    platform: linux/amd64
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - REDIS_URL=redis://redis:6379
      - MOCK_INFERENCE=1
      - MODEL_DIR=/app/models
      - OUTPUT_DIR=/app/outputs
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      - redis

  worker:
    platform: linux/amd64
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    command: rq worker cinematic_jobs -u redis://redis:6379
    environment:
      - REDIS_URL=redis://redis:6379
      - MOCK_INFERENCE=1
      - MODEL_DIR=/app/models
      - OUTPUT_DIR=/app/outputs
    volumes:
      - .:/app
      - /app/models  # prevent local models dir from overwriting container's downloaded models if any
    depends_on:
      - redis
